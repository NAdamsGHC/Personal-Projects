<svg xmlns="http://www.w3.org/2000/svg" width="400" height="276" viewBox="0 0 400 276" role="img" aria-label="Grid tactical schematic, traced from the in-game minimap.">
<defs><pattern id="hz" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="8" stroke="#c25b4e" stroke-width="2.5" opacity="0.38"/></pattern>
<style>
.terr{fill:#1b2429;stroke:#55636e;stroke-width:1.4}
.b{fill:#39454c;stroke:#8fb0aa;stroke-width:1.1}
.s{fill:#2b353c;stroke:#6b7d80;stroke-width:1}
.sp{fill:#17313a;stroke:#8fb0aa;stroke-width:1.3}
.rock{fill:#333f45;stroke:#7d8f92;stroke-width:0.9}
.water{fill:#24343c;stroke:#8fb0aa;stroke-width:1}
.hot{fill:url(#hz);stroke:#c25b4e;stroke-width:1}
.lbl{fill:#e6ecec;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
     font-size:11.5px;letter-spacing:0.4px}
.lbl2{fill:#93a4a6;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
      font-size:10.5px;letter-spacing:0.2px}
.hotlbl{fill:#d99a90;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
        font-size:10.5px;letter-spacing:0.2px}
.ttl{fill:#e6ecec;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
     font-size:13.0px;letter-spacing:0.8px;font-weight:600}
.pin{fill:#d98b4a}
.pinn{fill:#0b0f11;font-family:ui-sans-serif,system-ui,sans-serif;font-size:11px;font-weight:700}
.link{stroke:#55636e;stroke-width:1.3;fill:none;stroke-dasharray:3 3}

.go{fill:#1d3b2f;stroke:#5fb08a;stroke-width:1.5}
.golbl{fill:#a9dcc0;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
       font-size:11.5px;letter-spacing:0.4px}
</style></defs>
<text class="ttl" x="8" y="17">GRID</text>
<rect class="hot" x="110" y="116" width="284" height="26" rx="2"/>
<text class="hotlbl" x="115" y="133">OPEN CORRIDOR</text>
<rect class="go" x="130" y="24" width="110" height="88" rx="2"/>
<text class="golbl" x="135" y="72">MID CONTROL</text>
<rect class="go" x="130" y="148" width="140" height="76" rx="2"/>
<text class="golbl" x="135" y="183.25">THE FACILITY</text>
<text class="golbl" x="135" y="196.75">2ND FLOOR</text>
<rect class="s" x="44" y="28" width="68" height="34" rx="2"/>
<text class="lbl2" x="49" y="49">HANGAR</text>
<rect class="s" x="44" y="68" width="68" height="34" rx="2"/>
<text class="lbl2" x="49" y="89">PARKING</text>
<rect class="s" x="6" y="148" width="60" height="32" rx="2"/>
<text class="lbl2" x="11" y="168">W BLOCK</text>
<rect class="s" x="50" y="232" width="80" height="30" rx="2"/>
<text class="lbl2" x="55" y="251">LONG ALLEY</text>
<rect class="s" x="282" y="24" width="108" height="30" rx="2"/>
<text class="lbl2" x="287" y="43">NE BLOCK</text>
<rect class="hot" x="282" y="62" width="108" height="42" rx="2"/>
<text class="hotlbl" x="287" y="80.25">EAST: OPEN</text>
<text class="hotlbl" x="287" y="93.75">GROUND</text>
<circle class="pin" cx="228" cy="36" r="9"/><text class="pinn" x="224.9" y="40">1</text>
<circle class="pin" cx="256" cy="160" r="9"/><text class="pinn" x="252.9" y="164">2</text>
</svg>