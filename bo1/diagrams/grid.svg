<svg xmlns="http://www.w3.org/2000/svg" width="400" height="330" viewBox="0 0 400 330" role="img" aria-label="Grid tactical schematic traced from the in-game minimap: two major buildings north and south split by an open corridor, a hangar cluster north-west, a long alley to the south-west and open sniper ground east.">
  <defs>
    <pattern id="gd-danger" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#c25b4e" stroke-width="2.5" opacity="0.36"/>
    </pattern>
    <style>
      .terr { fill:#1b2429; stroke:#55636e; stroke-width:1.4; }
      .b  { fill:#39454c; stroke:#8fb0aa; stroke-width:1.2; }
      .s  { fill:#2b353c; stroke:#6b7d80; stroke-width:1; }
      .t  { fill:#e6ecec; font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
            font-size:10px; letter-spacing:0.9px; }
      .ts { fill:#93a4a6; font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
            font-size:8.4px; letter-spacing:0.6px; }
      .td { fill:#d99a90; font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
            font-size:8.4px; letter-spacing:0.6px; }
      .fence { stroke:#6b7d80; stroke-width:2; stroke-dasharray:6 3; }
      .pin { fill:#d98b4a; }
      .pint { fill:#0b0f11; font-family:ui-sans-serif,system-ui,sans-serif; font-size:9px; font-weight:700; }
    </style>
  </defs>

  <text class="t"  x="8" y="14">GRID</text>
  <text class="ts" x="48" y="14">— TRACED FROM THE IN-GAME MINIMAP · LARGE, BUT PLAYS SMALL</text>

  <!-- footprint -->
  <path class="terr" d="M50 26 L268 22 L272 30 L396 30 L396 128 L370 128 L370 160 L396 160 L392 236 L108 240 L108 200 L48 200 L48 156 L2 156 L2 192 L48 192 L48 200 L44 240 L64 240 L64 322 L102 322 L102 240 L138 240 L138 26 Z"/>

  <!-- open corridor between the two buildings -->
  <rect x="112" y="124" width="284" height="26" fill="url(#gd-danger)" stroke="#c25b4e" stroke-width="0.9"/>
  <line class="fence" x1="232" y1="140" x2="394" y2="140"/>
  <text class="td" x="118" y="141">OPEN CORRIDOR — CHOKES BOTH ENDS</text>

  <!-- north major building -->
  <rect class="b" x="134" y="18" width="102" height="104" rx="2"/>
  <rect class="s" x="152" y="44" width="66" height="62" rx="2"/>
  <text class="t"  x="140" y="36">MID CONTROL</text>
  <text class="ts" x="140" y="118">RAILING PEEKS THE ALLEY</text>

  <!-- south major building -->
  <rect class="b" x="138" y="152" width="132" height="82" rx="2"/>
  <rect class="s" x="200" y="166" width="20" height="18" rx="2"/>
  <text class="t"  x="146" y="172">THE FACILITY</text>
  <text class="ts" x="146" y="188">2ND FLOOR — ANGLES</text>
  <text class="td" x="146" y="204">DOORWAYS = CLAYMORE CHOKE</text>

  <!-- north-west hangar cluster -->
  <rect class="s" x="50" y="30" width="22" height="22" rx="2"/>
  <rect class="s" x="80" y="30" width="22" height="22" rx="2"/>
  <rect class="s" x="50" y="62" width="22" height="22" rx="2"/>
  <rect class="s" x="80" y="62" width="22" height="22" rx="2"/>
  <text class="ts" x="46" y="100">BACK HANGAR</text>
  <text class="ts" x="46" y="112">+ PARKING LOT</text>

  <!-- west block -->
  <rect class="s" x="4" y="156" width="50" height="36" rx="2"/>
  <text class="ts" x="8" y="178">W BLOCK</text>

  <!-- south-west long alley -->
  <rect class="s" x="64" y="240" width="38" height="82" rx="2"/>
  <text class="ts" x="68" y="276">LONG</text>
  <text class="ts" x="68" y="288">ALLEY</text>
  <text class="ts" x="68" y="300">(TREES)</text>

  <!-- east open ground -->
  <text class="t"  x="286" y="60">OPEN GROUND</text>
  <text class="td" x="286" y="74">SNIPER HAVEN</text>
  <text class="td" x="286" y="86">THEY BLEND INTO</text>
  <text class="td" x="286" y="98">THE BUSHES</text>
  <rect class="s" x="272" y="18" width="46" height="18" rx="2"/>
  <rect class="s" x="330" y="170" width="18" height="30" rx="2"/>
  <rect class="s" x="286" y="196" width="24" height="16" rx="2"/>

  <!-- markers -->
  <circle class="pin" cx="226" cy="34" r="8"/><text class="pint" x="223.5" y="37">1</text>
  <circle class="pin" cx="258" cy="164" r="8"/><text class="pint" x="255.5" y="167">2</text>

  <text class="ts" x="8" y="298">MID STATUE, THE PROPANE TANKS, THE RED BARREL AND THE SPAWN ROOFTOP ARE ON</text>
  <text class="ts" x="8" y="310">THIS MAP — UNLABELLED ON THE MINIMAP, SO NOT PLACED HERE</text>
  <text class="ts" x="8" y="324">GEOMETRY FROM THE MINIMAP · LABELS BEST-EFFORT — CORRECT THEM</text>
</svg>
