<svg xmlns="http://www.w3.org/2000/svg" width="400" height="322.5" viewBox="0 0 400 322.5" role="img" aria-label="Nuketown tactical schematic, traced from the in-game minimap.">
<defs><pattern id="hz" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="8" stroke="#c25b4e" stroke-width="2.5" opacity="0.38"/></pattern>
<style>
.terr{fill:#1b2429;stroke:#55636e;stroke-width:1.4}
.b{fill:#39454c;stroke:#8fb0aa;stroke-width:1.1}
.s{fill:#2b353c;stroke:#6b7d80;stroke-width:1}
.sp{fill:#17313a;stroke:#8fb0aa;stroke-width:1.3}
.rock{fill:#333f45;stroke:#7d8f92;stroke-width:0.9}
.water{fill:#24343c;stroke:#8fb0aa;stroke-width:1}
.hot{fill:url(#hz);stroke:#c25b4e;stroke-width:1}
.lbl{fill:#e6ecec;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
     font-size:9.0px;letter-spacing:0.7px}
.lbl2{fill:#93a4a6;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
      font-size:8.0px;letter-spacing:0.5px}
.hotlbl{fill:#d99a90;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
        font-size:8.0px;letter-spacing:0.5px}
.ttl{fill:#e6ecec;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
     font-size:10.5px;letter-spacing:1.0px;font-weight:600}
.key{fill:#93a4a6;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
     font-size:8.6px;letter-spacing:0.5px}
.keyhot{fill:#d99a90;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
        font-size:8.6px;letter-spacing:0.5px}
.pin{fill:#d98b4a}
.pinn{fill:#0b0f11;font-family:ui-sans-serif,system-ui,sans-serif;font-size:9px;font-weight:700}
.link{stroke:#55636e;stroke-width:1.3;fill:none;stroke-dasharray:3 3}

.go{fill:#1d3b2f;stroke:#5fb08a;stroke-width:1.5}
.golbl{fill:#a9dcc0;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
       font-size:9px;letter-spacing:0.7px}
</style></defs>
<text class="ttl" x="8" y="15">NUKETOWN</text>
<text class="key" x="85.12" y="15">— schematic</text>
<rect class="s" x="6" y="40" width="388" height="24" rx="2"/>
<text class="lbl2" x="11" y="55">SIDE LANE</text>
<rect class="s" x="6" y="210" width="388" height="24" rx="2"/>
<text class="lbl2" x="11" y="225">SIDE LANE</text>
<rect class="sp" x="6" y="100" width="44" height="74" rx="2"/>
<text class="lbl" x="11" y="140">SPAWN</text>
<rect class="sp" x="344" y="100" width="44" height="74" rx="2"/>
<text class="lbl" x="349" y="140">SPAWN</text>
<rect class="go" x="58" y="76" width="96" height="122" rx="2"/>
<text class="golbl" x="63" y="140">HOUSE</text>
<rect class="s" x="58" y="152" width="44" height="46" rx="2"/>
<text class="lbl2" x="63" y="178">GARAGE</text>
<rect class="go" x="240" y="76" width="96" height="122" rx="2"/>
<text class="golbl" x="245" y="140">HOUSE</text>
<rect class="s" x="292" y="152" width="44" height="46" rx="2"/>
<text class="lbl2" x="297" y="178">GARAGE</text>
<rect class="hot" x="162" y="70" width="70" height="134" rx="2"/>
<text class="hotlbl" x="167" y="140">CENTRE</text>
<rect class="s" x="170" y="66" width="54" height="16" rx="2"/>
<text class="lbl2" x="175" y="77">BUS</text>
<rect class="s" x="170" y="192" width="54" height="16" rx="2"/>
<text class="lbl2" x="175" y="203">TRUCK</text>
<circle class="pin" cx="144" cy="88" r="8"/><text class="pinn" x="141.5" y="91.2">1</text>
<circle class="pin" cx="250" cy="88" r="8"/><text class="pinn" x="247.5" y="91.2">1</text>
<circle class="pin" cx="238" cy="200" r="8"/><text class="pinn" x="235.5" y="203.2">2</text>
<rect class="go" x="8" y="244" width="16" height="11" rx="2"/>
<text class="key" x="30" y="253">head for</text>
<rect class="hot" x="92" y="244" width="16" height="11" rx="2"/>
<text class="keyhot" x="114" y="253">avoid / cross fast</text>
<text class="key" x="8" y="266.5">Spawns are the back gardens — clear them fast</text>
<text class="key" x="8" y="279">1  Upper floor — the view over the centre</text>
<text class="key" x="8" y="291.5">2  Truck opening — covers 3 of the 4 chokes</text>
<text class="keyhot" x="8" y="304">Centre is a warzone. Cars explode; not cover.</text>
</svg>