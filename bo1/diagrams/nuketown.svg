<rect class="go" x="58" y="76" width="96" height="122" rx="2"/>
<text class="golbl" x="63" y="141">HOUSE</text>
<rect class="s" x="58" y="152" width="52" height="46" rx="2"/>
<text class="lbl2" x="63" y="179">GARAGE</text>
