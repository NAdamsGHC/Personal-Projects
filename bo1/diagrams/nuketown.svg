<svg xmlns="http://www.w3.org/2000/svg" width="420" height="280" viewBox="0 0 420 280" role="img" aria-label="Nuketown tactical schematic: two houses either side of a central road with a bus and truck, back gardens as spawns, side lanes top and bottom.">
  <defs>
    <pattern id="nt-danger" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#c25b4e" stroke-width="2.5" opacity="0.42"/>
    </pattern>
    <marker id="nt-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8fb0aa"/>
    </marker>
    <style>
      .b  { fill:#2b353c; stroke:#55636e; stroke-width:1.2; }
      .g  { fill:#212a30; stroke:#3f4c55; stroke-width:1; }
      .sp { fill:#17313a; stroke:#8fb0aa; stroke-width:1.2; }
      .v  { fill:#3c4952; stroke:#6b7d80; stroke-width:1; }
      .t  { fill:#e6ecec; font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
            font-size:11px; letter-spacing:1.2px; text-transform:uppercase; }
      .ts { fill:#93a4a6; font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
            font-size:9.5px; letter-spacing:1px; }
      .td { fill:#d99a90; font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
            font-size:9.5px; letter-spacing:1px; }
      .route { fill:none; stroke:#8fb0aa; stroke-width:2; stroke-dasharray:6 4; marker-end:url(#nt-arrow); }
      .pin { fill:#d98b4a; }
      .pint { fill:#0b0f11; font-family:ui-sans-serif,system-ui,sans-serif; font-size:10px; font-weight:700; }
      .cp { fill:none; stroke:#c25b4e; stroke-width:1.6; }
    </style>
  </defs>

  <!-- side lanes -->
  <rect class="g" x="8" y="30" width="404" height="26" rx="2"/>
  <rect class="g" x="8" y="224" width="404" height="26" rx="2"/>
  <text class="ts" x="150" y="47">SIDE LANE</text>
  <text class="ts" x="150" y="241">SIDE LANE</text>

  <!-- spawns / back gardens -->
  <rect class="sp" x="8" y="98" width="40" height="84" rx="2"/>
  <text class="ts" x="11" y="128">BACK</text>
  <text class="ts" x="11" y="140">GARDEN</text>
  <text class="t"  x="14" y="158">SPAWN</text>

  <rect class="sp" x="372" y="98" width="40" height="84" rx="2"/>
  <text class="ts" x="376" y="128">BACK</text>
  <text class="ts" x="376" y="140">GARDEN</text>
  <text class="t"  x="379" y="158">SPAWN</text>

  <!-- houses -->
  <rect class="b" x="56" y="76" width="86" height="128" rx="2"/>
  <text class="t" x="64" y="94">HOUSE</text>
  <rect class="g" x="56" y="160" width="40" height="44" rx="2"/>
  <text class="ts" x="59" y="186">GARAGE</text>

  <rect class="b" x="278" y="76" width="86" height="128" rx="2"/>
  <text class="t" x="286" y="94">HOUSE</text>
  <rect class="g" x="324" y="160" width="40" height="44" rx="2"/>
  <text class="ts" x="327" y="186">GARAGE</text>

  <!-- centre: the warzone -->
  <rect x="150" y="64" width="120" height="152" fill="url(#nt-danger)" stroke="#c25b4e" stroke-width="1" opacity="0.9" rx="2"/>
  <text class="td" x="163" y="112">THE CENTRE</text>
  <text class="td" x="163" y="125">IS A WARZONE</text>

  <!-- vehicles -->
  <rect class="v" x="172" y="60" width="76" height="18" rx="2"/>
  <text class="ts" x="199" y="73">BUS</text>
  <rect class="v" x="172" y="202" width="76" height="18" rx="2"/>
  <text class="ts" x="193" y="215">TRUCK</text>

  <!-- power position markers -->
  <circle class="pin" cx="132" cy="88" r="9"/><text class="pint" x="129" y="92">1</text>
  <circle class="pin" cx="288" cy="88" r="9"/><text class="pint" x="285" y="92">1</text>
  <circle class="pin" cx="210" cy="211" r="9"/><text class="pint" x="207" y="215">2</text>

  <!-- chokepoints -->
  <circle class="cp" cx="96" cy="182" r="5"/>
  <circle class="cp" cx="142" cy="140" r="5"/>
  <circle class="cp" cx="120" cy="204" r="5"/>

  <!-- route: out of spawn, along the side lane, not through the middle -->
  <path class="route" d="M30 98 L30 56 L150 43 L262 43 L300 62"/>

  <!-- legend -->
  <text class="t"  x="8" y="20">NUKETOWN</text>
  <text class="ts" x="92" y="20">— SCHEMATIC, NOT TO SCALE</text>

  <circle class="pin" cx="14" cy="266" r="6"/><text class="pint" x="11.5" y="269.5">1</text>
  <text class="ts" x="25" y="269">UPPER FLOOR — VIEW OVER THE CENTRE</text>
  <circle class="pin" cx="224" cy="266" r="6"/><text class="pint" x="221.5" y="269.5">2</text>
  <text class="ts" x="235" y="269">TRUCK OPENING — COVERS 3 OF 4 CHOKEPOINTS</text>
</svg>
