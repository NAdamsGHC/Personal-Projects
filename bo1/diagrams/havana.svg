<svg xmlns="http://www.w3.org/2000/svg" width="400" height="379" viewBox="0 0 400 379" role="img" aria-label="Havana tactical schematic, traced from the in-game minimap.">
<defs><pattern id="hz" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="8" stroke="#c25b4e" stroke-width="2.5" opacity="0.38"/></pattern>
<style>
.terr{fill:#1b2429;stroke:#55636e;stroke-width:1.4}
.b{fill:#39454c;stroke:#8fb0aa;stroke-width:1.1}
.s{fill:#2b353c;stroke:#6b7d80;stroke-width:1}
.sp{fill:#17313a;stroke:#8fb0aa;stroke-width:1.3}
.rock{fill:#333f45;stroke:#7d8f92;stroke-width:0.9}
.water{fill:#24343c;stroke:#8fb0aa;stroke-width:1}
.hot{fill:url(#hz);stroke:#c25b4e;stroke-width:1}
.lbl{fill:#e6ecec;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
     font-size:9.0px;letter-spacing:0.7px}
.lbl2{fill:#93a4a6;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
      font-size:8.0px;letter-spacing:0.5px}
.hotlbl{fill:#d99a90;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
        font-size:8.0px;letter-spacing:0.5px}
.ttl{fill:#e6ecec;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
     font-size:10.5px;letter-spacing:1.0px;font-weight:600}
.key{fill:#93a4a6;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
     font-size:8.6px;letter-spacing:0.5px}
.keyhot{fill:#d99a90;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
        font-size:8.6px;letter-spacing:0.5px}
.pin{fill:#d98b4a}
.pinn{fill:#0b0f11;font-family:ui-sans-serif,system-ui,sans-serif;font-size:9px;font-weight:700}
.link{stroke:#55636e;stroke-width:1.3;fill:none;stroke-dasharray:3 3}

.go{fill:#1d3b2f;stroke:#5fb08a;stroke-width:1.5}
.golbl{fill:#a9dcc0;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
       font-size:9px;letter-spacing:0.7px}
</style></defs>
<text class="ttl" x="8" y="15">HAVANA</text>
<text class="key" x="68.84" y="15">— go round, not through</text>
<rect class="hot" x="168" y="66" width="60" height="200" rx="2"/>
<text class="hotlbl" x="173" y="163.5">MAIN</text>
<text class="hotlbl" x="173" y="174.5">STREET</text>
<rect class="sp" x="20" y="30" width="138" height="24" rx="2"/>
<text class="lbl" x="25" y="45">TROPAS</text>
<rect class="b" x="238" y="30" width="150" height="36" rx="2"/>
<text class="lbl" x="243" y="51">SNIPER HOUSE</text>
<rect class="go" x="20" y="72" width="138" height="52" rx="2"/>
<text class="golbl" x="25" y="95.5">CIGAR SHOP</text>
<text class="golbl" x="25" y="106.5">2ND LEVEL</text>
<rect class="go" x="238" y="72" width="150" height="52" rx="2"/>
<text class="golbl" x="243" y="95.5">HOTEL</text>
<text class="golbl" x="243" y="106.5">2ND LEVEL</text>
<rect class="s" x="30" y="134" width="118" height="32" rx="2"/>
<text class="lbl2" x="35" y="153">FOUNTAIN</text>
<rect class="s" x="20" y="176" width="100" height="30" rx="2"/>
<text class="lbl2" x="25" y="194">BACK CAFE</text>
<rect class="s" x="128" y="176" width="40" height="30" rx="2"/>
<text class="lbl2" x="133" y="194">TRASH</text>
<rect class="s" x="280" y="134" width="108" height="32" rx="2"/>
<text class="lbl2" x="285" y="153">BAR</text>
<rect class="s" x="236" y="134" width="40" height="72" rx="2"/>
<text class="lbl2" x="241" y="173">ALLEY</text>
<rect class="s" x="184" y="176" width="44" height="30" rx="2"/>
<text class="lbl2" x="189" y="194">DUMP</text>
<rect class="b" x="238" y="216" width="150" height="28" rx="2"/>
<text class="lbl" x="243" y="233">THE SHELTER</text>
<rect class="hot" x="20" y="216" width="118" height="30" rx="2"/>
<text class="hotlbl" x="25" y="234">RED ROOMS</text>
<rect class="sp" x="20" y="254" width="138" height="24" rx="2"/>
<text class="lbl" x="25" y="269">OP 40</text>
<circle class="pin" cx="150" cy="84" r="8"/><text class="pinn" x="147.5" y="87.2">1</text>
<circle class="pin" cx="376" cy="84" r="8"/><text class="pinn" x="373.5" y="87.2">2</text>
<rect class="go" x="8" y="288" width="16" height="11" rx="2"/>
<text class="key" x="30" y="297">head for</text>
<rect class="hot" x="92" y="288" width="16" height="11" rx="2"/>
<text class="keyhot" x="114" y="297">avoid / cross fast</text>
<text class="key" x="8" y="310.5">1 and 2 are twins — hold one each with a mate</text>
<text class="key" x="8" y="323">Cigar shop upstairs sees bus, bar and hotel</text>
<text class="key" x="8" y="335.5">Hotel upstairs sees shelter, fountain, cafe</text>
<text class="key" x="8" y="348">Motion sensor in the trash bags warns you</text>
<text class="keyhot" x="8" y="360.5">Red rooms: grenades and knifers</text>
</svg>