<svg xmlns="http://www.w3.org/2000/svg" width="420" height="330" viewBox="0 0 420 330" role="img" aria-label="Havana tactical schematic: Main Street down the centre as the danger zone, cigar shop and fountain on one side, hotel and bar on the other, with the shelter leading to the OP 40 spawn.">
  <defs>
    <pattern id="hv-danger" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#c25b4e" stroke-width="2.5" opacity="0.42"/>
    </pattern>
    <marker id="hv-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8fb0aa"/>
    </marker>
    <style>
      .b  { fill:#2b353c; stroke:#55636e; stroke-width:1.2; }
      .g  { fill:#212a30; stroke:#3f4c55; stroke-width:1; }
      .sp { fill:#17313a; stroke:#8fb0aa; stroke-width:1.2; }
      .t  { fill:#e6ecec; font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
            font-size:10.5px; letter-spacing:1px; }
      .ts { fill:#93a4a6; font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
            font-size:8.6px; letter-spacing:0.7px; }
      .td { fill:#d99a90; font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
            font-size:8.6px; letter-spacing:0.7px; }
      .route { fill:none; stroke:#8fb0aa; stroke-width:2; stroke-dasharray:6 4; marker-end:url(#hv-arrow); }
      .pin { fill:#d98b4a; }
      .pint { fill:#0b0f11; font-family:ui-sans-serif,system-ui,sans-serif; font-size:9.5px; font-weight:700; }
      .choke { fill:none; stroke:#c25b4e; stroke-width:1.8; }
    </style>
  </defs>

  <text class="t"  x="8" y="16">HAVANA</text>
  <text class="ts" x="68" y="16">— MOVE AROUND THE MAP, NOT THROUGH MAIN STREET</text>

  <!-- Main Street: the danger -->
  <rect x="184" y="70" width="58" height="196" fill="url(#hv-danger)" stroke="#c25b4e" stroke-width="1" rx="2"/>
  <text class="td" x="190" y="150" transform="rotate(-90 190 150)">MAIN STREET — CROSS FAST</text>

  <!-- spawns -->
  <rect class="sp" x="104" y="28" width="138" height="24" rx="2"/>
  <text class="t" x="110" y="44">TROPAS · BEHIND BUS</text>

  <rect class="sp" x="146" y="272" width="132" height="24" rx="2"/>
  <text class="t" x="152" y="288">OP 40 SPAWN</text>

  <!-- sniper house -->
  <rect class="b" x="256" y="28" width="140" height="36" rx="2"/>
  <text class="t"  x="262" y="43">SNIPER HOUSE</text>
  <text class="ts" x="262" y="56">LOOKS DOWN MAIN STREET</text>

  <!-- cigar shop (left) -->
  <rect class="b" x="30" y="72" width="146" height="54" rx="2"/>
  <text class="t"  x="36" y="88">CIGAR SHOP</text>
  <text class="ts" x="36" y="101">MANY ENTRANCES</text>
  <text class="ts" x="36" y="114">2ND LVL SEES BUS · BAR · HOTEL</text>

  <!-- hotel (right) -->
  <rect class="b" x="250" y="72" width="146" height="54" rx="2"/>
  <text class="t"  x="256" y="88">HOTEL</text>
  <text class="ts" x="256" y="101">SAME LAYOUT AS CIGAR SHOP</text>
  <text class="ts" x="256" y="114">2ND LVL SEES SHELTER · FOUNTAIN</text>

  <!-- fountain + cafe + trash bags -->
  <rect class="g" x="56" y="136" width="120" height="34" rx="2"/>
  <text class="t"  x="62" y="150">FOUNTAIN</text>
  <text class="ts" x="62" y="163">COVER, BUT BUSY</text>

  <rect class="b" x="30" y="180" width="104" height="32" rx="2"/>
  <text class="ts" x="36" y="195">BACK CAFE</text>
  <text class="ts" x="36" y="207">PEEKS THE FOUNTAIN</text>

  <rect class="g" x="140" y="180" width="44" height="32" rx="2"/>
  <text class="ts" x="144" y="194">TRASH</text>
  <text class="ts" x="144" y="206">BAGS</text>

  <!-- bar + back alley -->
  <rect class="b" x="292" y="136" width="104" height="34" rx="2"/>
  <text class="t"  x="298" y="150">BAR</text>
  <text class="ts" x="298" y="163">SEES CIGAR SHOP LVLS</text>

  <rect class="g" x="250" y="136" width="36" height="76" rx="2"/>
  <text class="ts" x="253" y="170">BACK</text>
  <text class="ts" x="253" y="182">ALLEY</text>

  <!-- dumpster -->
  <rect class="g" x="192" y="180" width="44" height="32" rx="2"/>
  <text class="ts" x="196" y="194">DUMP-</text>
  <text class="ts" x="196" y="206">STER</text>

  <!-- shelter -->
  <rect class="b" x="146" y="222" width="132" height="30" rx="2"/>
  <text class="t"  x="152" y="238">THE SHELTER</text>
  <text class="ts" x="152" y="249">LEADS TO OP 40</text>

  <!-- red rooms + back rooms -->
  <rect class="g choke" x="30" y="222" width="106" height="34" rx="2"/>
  <text class="td" x="35" y="237">RED ROOMS</text>
  <text class="td" x="35" y="249">NADES + KNIFERS</text>

  <rect class="g" x="292" y="222" width="104" height="34" rx="2"/>
  <text class="ts" x="297" y="237">BACK ROOMS</text>
  <text class="td" x="297" y="249">CAMPERS</text>

  <!-- route: spawn, around not through -->
  <path class="route" d="M140 52 L104 62 L96 72"/>
  <path class="route" d="M104 126 L100 136"/>

  <!-- markers -->
  <circle class="pin" cx="163" cy="84" r="9"/><text class="pint" x="160" y="87.5">1</text>
  <circle class="pin" cx="383" cy="84" r="9"/><text class="pint" x="380" y="87.5">2</text>

  <text class="ts" x="8" y="312">ORIENTATION APPROXIMATE — SIDES ARE STATED, COMPASS IS NOT</text>
  <circle class="pin" cx="14" cy="324" r="6"/><text class="pint" x="11.5" y="327">1</text>
  <text class="ts" x="25" y="327">CIGAR SHOP UPSTAIRS</text>
  <circle class="pin" cx="176" cy="324" r="6"/><text class="pint" x="173.5" y="327">2</text>
  <text class="ts" x="187" y="327">HOTEL UPSTAIRS — THE TWO TWIN HOLDS</text>
</svg>
