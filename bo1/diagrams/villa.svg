<svg xmlns="http://www.w3.org/2000/svg" width="400" height="335" viewBox="0 0 400 335" role="img" aria-label="Villa tactical schematic traced from the in-game minimap: a circular fountain court centre-north, mansion buildings west and centre, a pool on the west side, and structures east and south.">
  <defs>
    <pattern id="vl-danger" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#c25b4e" stroke-width="2.5" opacity="0.36"/>
    </pattern>
    <style>
      .terr { fill:#1b2429; stroke:#55636e; stroke-width:1.4; }
      .b  { fill:#39454c; stroke:#8fb0aa; stroke-width:1.1; }
      .s  { fill:#2b353c; stroke:#6b7d80; stroke-width:1; }
      .water { fill:#24343c; stroke:#8fb0aa; stroke-width:1; }
      .t  { fill:#e6ecec; font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
            font-size:10px; letter-spacing:0.9px; }
      .ts { fill:#93a4a6; font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
            font-size:8.4px; letter-spacing:0.6px; }
      .td { fill:#d99a90; font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
            font-size:8.4px; letter-spacing:0.6px; }
      .pin { fill:#d98b4a; }
      .pint { fill:#0b0f11; font-family:ui-sans-serif,system-ui,sans-serif; font-size:9px; font-weight:700; }
    </style>
  </defs>

  <text class="t"  x="8" y="14">VILLA</text>
  <text class="ts" x="54" y="14">— TRACED FROM THE IN-GAME MINIMAP</text>

  <!-- footprint -->
  <path class="terr" d="M170 20 L300 18 L330 34 L344 22 L390 30 L392 180 L370 186 L378 240 L340 246 L300 240 L286 280 L250 288 L226 328 L184 322 L172 286 L96 282 L74 250 L20 244 L4 210 L26 176 L4 150 L28 92 L96 78 L120 40 Z"/>

  <!-- fountain court, centre-north -->
  <circle class="b" cx="226" cy="102" r="40"/>
  <circle cx="226" cy="102" r="22" fill="#2b353c" stroke="#8fb0aa" stroke-width="0.9"/>
  <rect x="218" y="94" width="16" height="16" fill="#55636e" stroke="#8fb0aa" stroke-width="0.8"/>
  <path fill="none" stroke="#8fb0aa" stroke-width="2" d="M182 76 A 52 52 0 0 1 268 68"/>
  <text class="t"  x="202" y="52">FOUNTAIN</text>
  <text class="td" x="186" y="152">CHOKES BEYOND IT</text>

  <!-- mansion buildings, centre-west -->
  <rect class="b" x="96" y="116" width="54" height="58" rx="2"/>
  <text class="t"  x="100" y="136">MANSION</text>
  <text class="ts" x="100" y="150">EYES ACROSS</text>
  <text class="ts" x="100" y="162">THE MAP</text>

  <rect class="s" x="154" y="118" width="52" height="56" rx="2"/>
  <text class="ts" x="158" y="146">INNER</text>
  <text class="ts" x="158" y="158">ROOMS</text>

  <!-- pool, west -->
  <path class="water" d="M34 124 L54 128 L56 176 L40 190 L30 168 Z"/>
  <text class="t"  x="20" y="112">POOL</text>
  <text class="ts" x="14" y="206">TROPAS SPAWN SIDE</text>

  <!-- north-east buildings -->
  <rect class="s" x="278" y="20" width="66" height="42" rx="2"/>
  <text class="ts" x="282" y="44">NE BUILDINGS</text>
  <rect class="b" x="286" y="72" width="62" height="84" rx="2"/>
  <text class="ts" x="290" y="106">SNIPER</text>
  <text class="ts" x="290" y="118">HOUSE</text>
  <text class="ts" x="290" y="130">(LIKELY)</text>

  <!-- centre-bottom buildings -->
  <rect class="s" x="96" y="206" width="88" height="52" rx="2"/>
  <text class="ts" x="100" y="228">GUARD HOUSE</text>
  <text class="ts" x="100" y="240">/ DIRT ROAD</text>

  <rect class="s" x="192" y="206" width="76" height="52" rx="2"/>
  <text class="ts" x="196" y="234">CONNECTOR</text>

  <!-- open connector ground -->
  <rect x="192" y="176" width="76" height="24" fill="url(#vl-danger)" stroke="#c25b4e" stroke-width="0.9" rx="2"/>
  <text class="td" x="196" y="192">WATCHED GROUND</text>

  <!-- east structure with courtyard -->
  <rect class="b" x="286" y="188" width="80" height="52" rx="2"/>
  <rect class="s" x="302" y="202" width="48" height="24" rx="2"/>
  <text class="ts" x="290" y="256">MARKET / HILL SIDE</text>
  <text class="ts" x="290" y="268">OP 40 SPAWN</text>

  <!-- south protrusion -->
  <rect class="s" x="206" y="278" width="62" height="42" rx="2"/>
  <text class="ts" x="210" y="302">BACK ROAD</text>

  <!-- markers -->
  <circle class="pin" cx="142" cy="126" r="8"/><text class="pint" x="139.5" y="129">1</text>
  <circle class="pin" cx="338" cy="82" r="8"/><text class="pint" x="335.5" y="85">2</text>

  <text class="ts" x="8" y="304">THE STATUE, BAR, GARAGE, DOUBLE DOORS AND BACK HILL ARE ON THIS MAP —</text>
  <text class="ts" x="8" y="316">UNLABELLED ON THE MINIMAP, SO NOT PLACED HERE</text>
  <text class="ts" x="8" y="330">GEOMETRY FROM THE MINIMAP · LABELS BEST-EFFORT — CORRECT THEM</text>
</svg>
