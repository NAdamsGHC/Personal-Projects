<svg xmlns="http://www.w3.org/2000/svg" width="400" height="354.5" viewBox="0 0 400 354.5" role="img" aria-label="Villa tactical schematic, traced from the in-game minimap.">
<defs><pattern id="hz" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="8" stroke="#c25b4e" stroke-width="2.5" opacity="0.38"/></pattern>
<style>
.terr{fill:#1b2429;stroke:#55636e;stroke-width:1.4}
.b{fill:#39454c;stroke:#8fb0aa;stroke-width:1.1}
.s{fill:#2b353c;stroke:#6b7d80;stroke-width:1}
.sp{fill:#17313a;stroke:#8fb0aa;stroke-width:1.3}
.rock{fill:#333f45;stroke:#7d8f92;stroke-width:0.9}
.water{fill:#24343c;stroke:#8fb0aa;stroke-width:1}
.hot{fill:url(#hz);stroke:#c25b4e;stroke-width:1}
.lbl{fill:#e6ecec;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
     font-size:9.0px;letter-spacing:0.7px}
.lbl2{fill:#93a4a6;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
      font-size:8.0px;letter-spacing:0.5px}
.hotlbl{fill:#d99a90;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
        font-size:8.0px;letter-spacing:0.5px}
.ttl{fill:#e6ecec;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
     font-size:10.5px;letter-spacing:1.0px;font-weight:600}
.key{fill:#93a4a6;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
     font-size:8.6px;letter-spacing:0.5px}
.keyhot{fill:#d99a90;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
        font-size:8.6px;letter-spacing:0.5px}
.pin{fill:#d98b4a}
.pinn{fill:#0b0f11;font-family:ui-sans-serif,system-ui,sans-serif;font-size:9px;font-weight:700}
.link{stroke:#55636e;stroke-width:1.3;fill:none;stroke-dasharray:3 3}
</style></defs>
<text class="ttl" x="8" y="15">VILLA</text>
<text class="key" x="60.7" y="15">— three elevated holds</text>
<circle class="b" cx="210" cy="96" r="40"/>
<circle cx="210" cy="96" r="22" fill="#2b353c" stroke="#8fb0aa" stroke-width="0.9"/>
<text class="lbl" x="178" y="44">FOUNTAIN</text>
<rect class="b" x="20" y="108" width="108" height="44" rx="2"/>
<text class="lbl" x="25" y="133">MANSION</text>
<rect class="water" x="20" y="60" width="108" height="34" rx="2"/>
<text class="lbl" x="25" y="80">POOL · TROPAS</text>
<rect class="s" x="140" y="150" width="108" height="34" rx="2"/>
<text class="lbl2" x="145" y="170">INNER ROOMS</text>
<rect class="s" x="272" y="30" width="116" height="34" rx="2"/>
<text class="lbl2" x="277" y="50">NE BUILDINGS</text>
<rect class="b" x="272" y="74" width="116" height="44" rx="2"/>
<text class="lbl" x="277" y="99">SNIPER HOUSE</text>
<rect class="s" x="20" y="168" width="108" height="34" rx="2"/>
<text class="lbl2" x="25" y="188">GUARD HOUSE</text>
<rect class="hot" x="140" y="196" width="108" height="30" rx="2"/>
<text class="hotlbl" x="145" y="214">CONNECTOR</text>
<rect class="b" x="272" y="150" width="116" height="40" rx="2"/>
<text class="lbl" x="277" y="173">MARKET · OP 40</text>
<rect class="s" x="140" y="240" width="108" height="28" rx="2"/>
<text class="lbl2" x="145" y="257">BACK ROAD</text>
<circle class="pin" cx="120" cy="120" r="8"/><text class="pinn" x="117.5" y="123.2">1</text>
<circle class="pin" cx="380" cy="86" r="8"/><text class="pinn" x="377.5" y="89.2">2</text>
<text class="key" x="8" y="286">1  Mansion — eyes across to the sniper house</text>
<text class="key" x="8" y="298.5">2  Sniper house — the counter-hold</text>
<text class="key" x="8" y="311">Statue peeks the connector from a safe distance</text>
<text class="key" x="8" y="323.5">Garage and bar both lead back to the pool</text>
<text class="keyhot" x="8" y="336">Watch the back hill and back-road flankers</text>
</svg>