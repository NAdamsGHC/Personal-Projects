<svg xmlns="http://www.w3.org/2000/svg" width="380" height="420" viewBox="0 0 380 420" role="img" aria-label="WMD tactical schematic traced from the in-game minimap: a tall irregular facility with a silo to the north-east, a central building, a long structure on the east and warehouses to the south.">
  <defs>
    <style>
      .terr { fill:#1b2429; stroke:#55636e; stroke-width:1.4; }
      .b  { fill:#2b353c; stroke:#6b7d80; stroke-width:1.1; }
      .r  { fill:#242e34; stroke:#55636e; stroke-width:1; }
      .sp { fill:#17313a; stroke:#8fb0aa; stroke-width:1.3; }
      .t  { fill:#e6ecec; font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
            font-size:10px; letter-spacing:0.9px; }
      .ts { fill:#93a4a6; font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
            font-size:8.4px; letter-spacing:0.6px; }
      .td { fill:#d99a90; font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
            font-size:8.4px; letter-spacing:0.6px; }
      .pin { fill:#d98b4a; }
      .pint { fill:#0b0f11; font-family:ui-sans-serif,system-ui,sans-serif; font-size:9px; font-weight:700; }
      .grid { stroke:#55636e; stroke-width:0.7; }
    </style>
  </defs>

  <text class="t"  x="8" y="14">WMD</text>
  <text class="ts" x="48" y="14">— TRACED FROM THE IN-GAME MINIMAP</text>

  <!-- overall footprint -->
  <path class="terr" d="M150 24 L246 24 L262 40 L318 40 L318 96 L340 96 L340 300 L300 300 L300 340 L262 340 L262 402 L100 402 L100 330 L60 330 L60 250 L4 250 L4 150 L86 150 L86 60 L150 60 Z"/>

  <!-- silo, north-east -->
  <circle class="b" cx="281" cy="60" r="20"/>
  <circle cx="281" cy="60" r="11" fill="#3c4952" stroke="#8fb0aa" stroke-width="1"/>
  <text class="t"  x="252" y="34">SILOS</text>
  <text class="ts" x="240" y="94">ELEVATED · EAST</text>

  <!-- north-west block -->
  <rect class="b" x="80" y="78" width="80" height="52" rx="2"/>
  <text class="ts" x="85" y="98">NORTH LANE</text>
  <text class="ts" x="85" y="110">ALLEY + WIDE</text>
  <text class="ts" x="85" y="122">PASSAGE</text>

  <!-- central building with tanks -->
  <rect class="b" x="150" y="138" width="108" height="76" rx="2"/>
  <circle cx="186" cy="176" r="9" fill="#3c4952" stroke="#8fb0aa" stroke-width="0.9"/>
  <circle cx="216" cy="176" r="9" fill="#3c4952" stroke="#8fb0aa" stroke-width="0.9"/>
  <text class="t"  x="156" y="156">MIDDLE HOUSE</text>
  <text class="td" x="156" y="200">4 ENTRANCES · 2ND LVL = 360°</text>

  <!-- east long structure -->
  <rect class="b" x="300" y="118" width="66" height="164" rx="2"/>
  <text class="ts" x="305" y="180" transform="rotate(-90 305 180)">EAST STRUCTURE</text>

  <!-- west wing -->
  <rect class="b" x="8" y="158" width="70" height="70" rx="2"/>
  <text class="ts" x="13" y="188">WEST WING</text>
  <text class="ts" x="13" y="200">WAREHOUSE</text>
  <text class="ts" x="13" y="212">SIDE</text>

  <!-- south-west warehouse (gridded roof) -->
  <rect class="r" x="96" y="254" width="110" height="64" rx="2"/>
  <line class="grid" x1="124" y1="254" x2="124" y2="318"/>
  <line class="grid" x1="152" y1="254" x2="152" y2="318"/>
  <line class="grid" x1="180" y1="254" x2="180" y2="318"/>
  <text class="ts" x="101" y="274">WAREHOUSE</text>
  <text class="td" x="101" y="310">CAMPER'S HAVEN — SEES SILOS</text>

  <!-- mid-lower block -->
  <rect class="b" x="214" y="262" width="94" height="72" rx="2"/>
  <text class="ts" x="219" y="284">FACTORY</text>
  <text class="ts" x="219" y="296">3 ENTRANCES</text>

  <!-- south warehouse -->
  <rect class="r" x="108" y="338" width="152" height="62" rx="2"/>
  <line class="grid" x1="146" y1="338" x2="146" y2="400"/>
  <line class="grid" x1="184" y1="338" x2="184" y2="400"/>
  <line class="grid" x1="222" y1="338" x2="222" y2="400"/>
  <text class="ts" x="113" y="358">SOUTH WAREHOUSES</text>

  <!-- spawns -->
  <rect class="sp" x="304" y="292" width="70" height="26" rx="2"/>
  <text class="ts" x="309" y="309">EAST SPAWN</text>
  <rect class="sp" x="8" y="236" width="70" height="26" rx="2"/>
  <text class="ts" x="13" y="253">WEST SPAWN</text>

  <!-- markers -->
  <circle class="pin" cx="248" cy="150" r="8"/><text class="pint" x="245.5" y="153">1</text>
  <circle class="pin" cx="270" cy="60" r="8" opacity="0"/>
  <circle class="pin" cx="196" cy="264" r="8"/><text class="pint" x="193.5" y="267">2</text>

  <text class="ts" x="8" y="380">RAFTERS, CATWALK, CAT HOUSE AND THE SNIPER PERCH ARE ON THIS MAP —</text>
  <text class="ts" x="8" y="392">THE MINIMAP DOESN'T LABEL THEM, SO THEY ARE NOT PLACED HERE</text>

  <text class="ts" x="8" y="414">GEOMETRY FROM THE MINIMAP · LABELS BEST-EFFORT — CORRECT THEM</text>
</svg>
