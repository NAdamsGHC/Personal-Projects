<svg xmlns="http://www.w3.org/2000/svg" width="420" height="280" viewBox="0 0 420 280" role="img" aria-label="Firing Range tactical schematic: central sniper tower linked by a wooden beam to a building, with a contested courtyard overlooked by a rooftop and windows.">
  <defs>
    <pattern id="fr-danger" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#c25b4e" stroke-width="2.5" opacity="0.42"/>
    </pattern>
    <marker id="fr-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8fb0aa"/>
    </marker>
    <style>
      .b  { fill:#2b353c; stroke:#55636e; stroke-width:1.2; }
      .g  { fill:#212a30; stroke:#3f4c55; stroke-width:1; }
      .sp { fill:#17313a; stroke:#8fb0aa; stroke-width:1.2; }
      .t  { fill:#e6ecec; font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
            font-size:11px; letter-spacing:1.2px; }
      .ts { fill:#93a4a6; font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
            font-size:9.5px; letter-spacing:1px; }
      .td { fill:#d99a90; font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
            font-size:9.5px; letter-spacing:1px; }
      .route { fill:none; stroke:#8fb0aa; stroke-width:2; stroke-dasharray:6 4; marker-end:url(#fr-arrow); }
      .beam { stroke:#8a7d5f; stroke-width:4; stroke-linecap:round; }
      .pin { fill:#d98b4a; }
      .pint { fill:#0b0f11; font-family:ui-sans-serif,system-ui,sans-serif; font-size:10px; font-weight:700; }
      .sight { stroke:#c25b4e; stroke-width:1.3; stroke-dasharray:4 3; fill:none; opacity:0.85; }
    </style>
  </defs>

  <text class="t"  x="8" y="20">FIRING RANGE</text>
  <text class="ts" x="104" y="20">— SCHEMATIC, NOT TO SCALE</text>

  <!-- bathroom hut, north-west -->
  <rect class="b" x="24" y="36" width="62" height="40" rx="2"/>
  <text class="ts" x="28" y="54">BATHROOM</text>
  <text class="ts" x="28" y="66">HUT · 2 EXITS</text>

  <!-- the wooden house — hotly contested -->
  <rect class="b" x="42" y="104" width="94" height="66" rx="2"/>
  <text class="t"  x="48" y="126">WOODEN</text>
  <text class="t"  x="48" y="140">HOUSE</text>
  <text class="ts" x="48" y="156">HOTLY CONTESTED</text>

  <!-- central tower C3 -->
  <rect class="b" x="182" y="100" width="46" height="50" rx="2"/>
  <text class="t"  x="188" y="122">TOWER</text>
  <text class="ts" x="188" y="136">C3 · LADDER</text>

  <!-- wooden beam across to D3 -->
  <line class="beam" x1="228" y1="124" x2="266" y2="124"/>
  <text class="ts" x="230" y="116">BEAM</text>

  <!-- building D3 -->
  <rect class="b" x="266" y="96" width="70" height="56" rx="2"/>
  <text class="t"  x="272" y="118">BUILDING</text>
  <text class="ts" x="272" y="132">D3</text>

  <!-- courtyard: the crossfire -->
  <rect x="150" y="160" width="200" height="60" fill="url(#fr-danger)" stroke="#c25b4e" stroke-width="1" rx="2"/>
  <text class="td" x="158" y="184">COURTYARD — MANY VANTAGE POINTS</text>
  <text class="td" x="158" y="198">CROSSFIRE. DO NOT SPRINT THROUGH.</text>

  <!-- rooftop D4 and windows E4 overlooking the courtyard -->
  <rect class="g" x="266" y="224" width="60" height="30" rx="2"/>
  <text class="ts" x="270" y="243">ROOFTOP D4</text>
  <rect class="g" x="344" y="160" width="60" height="30" rx="2"/>
  <text class="ts" x="348" y="179">WINDOWS E4</text>

  <!-- sightlines onto the courtyard -->
  <path class="sight" d="M296 224 L262 220"/>
  <path class="sight" d="M344 176 L350 178"/>
  <path class="sight" d="M205 150 L215 160"/>

  <!-- spawns (ends approximate) -->
  <rect class="sp" x="20" y="212" width="62" height="34" rx="2"/>
  <text class="t"  x="25" y="228">SPAWN</text>
  <text class="ts" x="25" y="240">END A</text>

  <rect class="sp" x="338" y="36" width="62" height="34" rx="2"/>
  <text class="t"  x="343" y="52">SPAWN</text>
  <text class="ts" x="343" y="64">END B</text>

  <!-- route: hug the buildings, avoid the courtyard -->
  <path class="route" d="M52 212 L46 178 L92 172 L140 150"/>

  <!-- markers -->
  <circle class="pin" cx="126" cy="112" r="9"/><text class="pint" x="123" y="116">1</text>
  <circle class="pin" cx="218" cy="108" r="9"/><text class="pint" x="215" y="112">2</text>

  <!-- legend -->
  <circle class="pin" cx="14" cy="266" r="6"/><text class="pint" x="11.5" y="269.5">1</text>
  <text class="ts" x="25" y="269">WOODEN HOUSE — THE MAP'S MAIN PRIZE</text>
  <circle class="pin" cx="224" cy="266" r="6"/><text class="pint" x="221.5" y="269.5">2</text>
  <text class="ts" x="235" y="269">TOWER — STRONG, AND GRENADED CONSTANTLY</text>

  <text class="ts" x="8" y="256">SPAWN ENDS APPROXIMATE — NOT SOURCED</text>
</svg>
