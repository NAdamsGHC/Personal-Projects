<svg xmlns="http://www.w3.org/2000/svg" width="400" height="398.5" viewBox="0 0 400 398.5" role="img" aria-label="Firing Range tactical schematic, traced from the in-game minimap.">
<defs><pattern id="hz" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="8" stroke="#c25b4e" stroke-width="2.5" opacity="0.38"/></pattern>
<style>
.terr{fill:#1b2429;stroke:#55636e;stroke-width:1.4}
.b{fill:#39454c;stroke:#8fb0aa;stroke-width:1.1}
.s{fill:#2b353c;stroke:#6b7d80;stroke-width:1}
.sp{fill:#17313a;stroke:#8fb0aa;stroke-width:1.3}
.rock{fill:#333f45;stroke:#7d8f92;stroke-width:0.9}
.water{fill:#24343c;stroke:#8fb0aa;stroke-width:1}
.hot{fill:url(#hz);stroke:#c25b4e;stroke-width:1}
.lbl{fill:#e6ecec;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
     font-size:9.0px;letter-spacing:0.7px}
.lbl2{fill:#93a4a6;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
      font-size:8.0px;letter-spacing:0.5px}
.hotlbl{fill:#d99a90;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
        font-size:8.0px;letter-spacing:0.5px}
.ttl{fill:#e6ecec;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
     font-size:10.5px;letter-spacing:1.0px;font-weight:600}
.key{fill:#93a4a6;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
     font-size:8.6px;letter-spacing:0.5px}
.keyhot{fill:#d99a90;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
        font-size:8.6px;letter-spacing:0.5px}
.pin{fill:#d98b4a}
.pinn{fill:#0b0f11;font-family:ui-sans-serif,system-ui,sans-serif;font-size:9px;font-weight:700}
.link{stroke:#55636e;stroke-width:1.3;fill:none;stroke-dasharray:3 3}

.go{fill:#1d3b2f;stroke:#5fb08a;stroke-width:1.5}
.golbl{fill:#a9dcc0;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
       font-size:9px;letter-spacing:0.7px}
</style></defs>
<text class="ttl" x="8" y="15">FIRING RANGE</text>
<text class="key" x="117.68" y="15">— three routes</text>
<rect class="sp" x="140" y="32" width="120" height="24" rx="2"/>
<text class="lbl" x="145" y="47">TROPAS · N</text>
<rect class="b" x="104" y="64" width="192" height="40" rx="2"/>
<text class="lbl" x="109" y="87">SHOOTING RANGE</text>
<rect class="s" x="20" y="64" width="76" height="40" rx="2"/>
<text class="lbl2" x="25" y="81.5">BATHROOM</text>
<text class="lbl2" x="25" y="92.5">HUT</text>
<rect class="hot" x="180" y="112" width="100" height="20" rx="2"/>
<text class="hotlbl" x="185" y="125">CONTAINER</text>
<rect class="s" x="92" y="112" width="48" height="70" rx="2"/>
<text class="lbl2" x="97" y="144.5">BACK</text>
<text class="lbl2" x="97" y="155.5">ALLEY</text>
<rect class="go" x="148" y="140" width="116" height="42" rx="2"/>
<text class="golbl" x="153" y="164">TOP WOODEN</text>
<rect class="s" x="296" y="140" width="92" height="34" rx="2"/>
<text class="lbl2" x="301" y="160">SNIPER PERCH</text>
<rect class="s" x="296" y="180" width="92" height="28" rx="2"/>
<text class="lbl2" x="301" y="197">THE NOOK</text>
<rect class="s" x="148" y="188" width="116" height="20" rx="2"/>
<text class="lbl2" x="153" y="201">SANDBAGS</text>
<rect class="hot" x="148" y="214" width="116" height="24" rx="2"/>
<text class="hotlbl" x="153" y="229">LOWER MID</text>
<rect class="s" x="30" y="186" width="88" height="34" rx="2"/>
<text class="lbl2" x="35" y="200.5">DOUBLE</text>
<text class="lbl2" x="35" y="211.5">BARRELS</text>
<rect class="go" x="160" y="246" width="128" height="34" rx="2"/>
<text class="golbl" x="165" y="266">GARAGE</text>
<rect class="sp" x="160" y="286" width="128" height="24" rx="2"/>
<text class="lbl" x="165" y="301">OP 40 · S</text>
<circle class="pin" cx="252" cy="152" r="8"/><text class="pinn" x="249.5" y="155.2">1</text>
<circle class="pin" cx="276" cy="258" r="8"/><text class="pinn" x="273.5" y="261.2">2</text>
<rect class="go" x="8" y="320" width="16" height="11" rx="2"/>
<text class="key" x="30" y="329">head for</text>
<rect class="hot" x="92" y="320" width="16" height="11" rx="2"/>
<text class="keyhot" x="114" y="329">avoid / cross fast</text>
<text class="key" x="8" y="342.5">1  Top wooden — eyes on most of the map</text>
<text class="key" x="8" y="355">2  Garage — elevated, watches the crossings</text>
<text class="keyhot" x="8" y="367.5">Shooting range: campers and spawn points</text>
<text class="keyhot" x="8" y="380">Flash over the container before committing</text>
</svg>