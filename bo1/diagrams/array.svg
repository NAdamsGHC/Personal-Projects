<circle class="pin" cx="216" cy="132" r="8"/><text class="pinn" x="213.5" y="135.2">1</text>
<circle class="pin" cx="266" cy="38" r="8"/><text class="pinn" x="263.5" y="41.2">2</text>
<rect class="go" x="8" y="270" width="16" height="11" rx="2"/>
<text class="key" x="30" y="279">head for</text>
<rect class="hot" x="92" y="270" width="16" height="11" rx="2"/>
<text class="keyhot" x="114" y="279">avoid / cross fast</text>
<text class="key" x="8" y="292.5">1  Relay dish — bulk of the fighting, blind SE</text>
<text class="keyhot" x="8" y="305">2  N tower — climbable, and a sitting duck</text>
<text class="key" x="8" y="317.5">East side has cover: the safe north-south route</text>
<text class="key" x="8" y="330">Crane, ice cannon, wedge, guardhouse not placed</text>
</svg>