<svg xmlns="http://www.w3.org/2000/svg" width="400" height="274" viewBox="0 0 400 274" role="img" aria-label="Array tactical schematic, traced from the in-game minimap.">
<defs><pattern id="hz" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="8" stroke="#c25b4e" stroke-width="2.5" opacity="0.38"/></pattern>
<style>
.terr{fill:#1b2429;stroke:#55636e;stroke-width:1.4}
.b{fill:#39454c;stroke:#8fb0aa;stroke-width:1.1}
.s{fill:#2b353c;stroke:#6b7d80;stroke-width:1}
.sp{fill:#17313a;stroke:#8fb0aa;stroke-width:1.3}
.rock{fill:#333f45;stroke:#7d8f92;stroke-width:0.9}
.water{fill:#24343c;stroke:#8fb0aa;stroke-width:1}
.hot{fill:url(#hz);stroke:#c25b4e;stroke-width:1}
.lbl{fill:#e6ecec;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
     font-size:11.5px;letter-spacing:0.4px}
.lbl2{fill:#93a4a6;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
      font-size:10.5px;letter-spacing:0.2px}
.hotlbl{fill:#d99a90;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
        font-size:10.5px;letter-spacing:0.2px}
.ttl{fill:#e6ecec;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
     font-size:13.0px;letter-spacing:0.8px;font-weight:600}
.pin{fill:#d98b4a}
.pinn{fill:#0b0f11;font-family:ui-sans-serif,system-ui,sans-serif;font-size:11px;font-weight:700}
.link{stroke:#55636e;stroke-width:1.3;fill:none;stroke-dasharray:3 3}

.go{fill:#1d3b2f;stroke:#5fb08a;stroke-width:1.5}
.golbl{fill:#a9dcc0;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
       font-size:11.5px;letter-spacing:0.4px}
</style></defs>
<text class="ttl" x="8" y="17">ARRAY</text>
<circle class="go" cx="170" cy="150" r="46"/>
<circle cx="170" cy="150" r="30" fill="#2b353c" stroke="#8fb0aa" stroke-width="0.9"/>
<text class="golbl" x="140" y="146">RELAY DISH</text>
<rect class="s" x="196" y="30" width="78" height="30" rx="2"/>
<text class="lbl2" x="201" y="49">N TOWER</text>
<rect class="s" x="28" y="60" width="96" height="34" rx="2"/>
<text class="lbl2" x="33" y="81">NW RISE</text>
<rect class="s" x="28" y="104" width="96" height="30" rx="2"/>
<text class="lbl2" x="33" y="123">NW BUILDING</text>
<rect class="s" x="20" y="186" width="96" height="30" rx="2"/>
<text class="lbl2" x="25" y="205">WEST CPLX</text>
<rect class="s" x="240" y="96" width="96" height="30" rx="2"/>
<text class="lbl2" x="245" y="115">E BUILDING</text>
<rect class="s" x="240" y="136" width="96" height="30" rx="2"/>
<text class="lbl2" x="245" y="155">NE BLOCK</text>
<rect class="go" x="240" y="186" width="96" height="30" rx="2"/>
<text class="golbl" x="245" y="205">E HANGAR</text>
<rect class="hot" x="130" y="236" width="130" height="24" rx="2"/>
<text class="hotlbl" x="135" y="252">OPEN SNOW</text>
<circle class="pin" cx="216" cy="132" r="9"/><text class="pinn" x="212.9" y="136">1</text>
<circle class="pin" cx="266" cy="38" r="9"/><text class="pinn" x="262.9" y="42">2</text>
</svg>