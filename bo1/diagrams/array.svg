<svg xmlns="http://www.w3.org/2000/svg" width="400" height="360" viewBox="0 0 400 360" role="img" aria-label="Array tactical schematic traced from the in-game minimap: a large central relay dish ringed by a road, with buildings clustered east and west and open ground north and south-west.">
  <defs>
    <pattern id="ar-danger" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#c25b4e" stroke-width="2.5" opacity="0.38"/>
    </pattern>
    <style>
      .terr { fill:#1b2429; stroke:#55636e; stroke-width:1.4; }
      .b  { fill:#2b353c; stroke:#6b7d80; stroke-width:1.1; }
      .t  { fill:#e6ecec; font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
            font-size:10px; letter-spacing:0.9px; }
      .ts { fill:#93a4a6; font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
            font-size:8.4px; letter-spacing:0.6px; }
      .td { fill:#d99a90; font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
            font-size:8.4px; letter-spacing:0.6px; }
      .road { fill:none; stroke:#3f4c55; stroke-width:9; }
      .pin { fill:#d98b4a; }
      .pint { fill:#0b0f11; font-family:ui-sans-serif,system-ui,sans-serif; font-size:9px; font-weight:700; }
    </style>
  </defs>

  <text class="t"  x="8" y="14">ARRAY</text>
  <text class="ts" x="54" y="14">— TRACED FROM THE IN-GAME MINIMAP</text>

  <!-- footprint -->
  <path class="terr" d="M110 26 L230 22 L300 40 L352 84 L346 132 L372 160 L356 220 L300 250 L246 262 L188 300 L150 340 L96 330 L58 286 L34 236 L28 176 L46 130 L74 96 L88 52 Z"/>

  <!-- ring road round the dish -->
  <ellipse class="road" cx="176" cy="182" rx="86" ry="70"/>

  <!-- central relay dish -->
  <circle class="b" cx="176" cy="182" r="46"/>
  <circle cx="176" cy="182" r="30" fill="#3c4952" stroke="#8fb0aa" stroke-width="1"/>
  <circle cx="176" cy="182" r="12" fill="#55636e" stroke="#8fb0aa" stroke-width="0.9"/>
  <text class="t"  x="140" y="176">RELAY DISH</text>
  <text class="ts" x="140" y="190">ARRAY TOWER</text>
  <text class="td" x="128" y="242">BULK OF THE FIGHTING · BLIND SPOT SE</text>

  <!-- north structure -->
  <rect class="b" x="206" y="30" width="42" height="30" rx="2"/>
  <text class="ts" x="210" y="49">N TOWER</text>

  <!-- north-west high ground / rocks -->
  <path class="b" d="M104 44 L164 36 L176 70 L150 100 L108 96 L94 70 Z"/>
  <text class="ts" x="110" y="72">NW HIGH</text>
  <text class="ts" x="110" y="84">GROUND</text>

  <!-- north-west building -->
  <rect class="b" x="98" y="106" width="62" height="30" rx="2"/>
  <text class="ts" x="103" y="125">NW BUILDING</text>

  <!-- west complex -->
  <rect class="b" x="40" y="152" width="52" height="42" rx="2"/>
  <rect class="b" x="76" y="164" width="22" height="16" rx="2"/>
  <text class="ts" x="44" y="176">WEST</text>
  <text class="ts" x="44" y="188">COMPLEX</text>

  <!-- south-west tanks -->
  <circle class="b" cx="44" cy="216" r="12"/>
  <circle class="b" cx="44" cy="246" r="12"/>
  <text class="ts" x="24" y="270">TANKS</text>

  <!-- south-west C structure -->
  <path class="b" d="M82 224 L118 224 L118 236 L96 236 L96 246 L118 246 L118 258 L82 258 Z"/>

  <!-- south structure -->
  <rect class="b" x="88" y="286" width="34" height="26" rx="2"/>
  <text class="ts" x="92" y="303">S HUT</text>

  <!-- east buildings -->
  <path class="b" d="M208 102 L266 96 L272 126 L212 134 Z"/>
  <text class="ts" x="214" y="120">E BUILDING</text>

  <rect class="b" x="278" y="98" width="52" height="40" rx="2"/>
  <text class="ts" x="282" y="122">NE BLOCK</text>

  <!-- east hangar, gridded -->
  <rect class="b" x="238" y="196" width="66" height="38" rx="2"/>
  <line x1="260" y1="196" x2="260" y2="234" stroke="#55636e" stroke-width="0.7"/>
  <line x1="282" y1="196" x2="282" y2="234" stroke="#55636e" stroke-width="0.7"/>
  <text class="ts" x="242" y="214">E HANGAR</text>

  <rect class="b" x="318" y="180" width="30" height="44" rx="2"/>
  <text class="ts" x="316" y="238">FAR E</text>

  <!-- eastern safe route -->
  <text class="ts" x="250" y="256">EAST SIDE — AMPLE COVER,</text>
  <text class="ts" x="250" y="268">SAFE N–S ROUTE</text>

  <!-- open ground warning -->
  <rect x="150" y="296" width="96" height="18" fill="url(#ar-danger)" stroke="#c25b4e" stroke-width="0.9" rx="2"/>
  <text class="td" x="154" y="309">OPEN SNOW — SNIPED</text>

  <!-- markers -->
  <circle class="pin" cx="216" cy="150" r="8"/><text class="pint" x="213.5" y="153">1</text>
  <circle class="pin" cx="228" cy="42" r="8"/><text class="pint" x="225.5" y="45">2</text>

  <text class="ts" x="8" y="332">THE CRANE, ICE CANNON, GUARDHOUSE STAIRS, WEDGE AND ELECTRICAL TOWER ARE ON</text>
  <text class="ts" x="8" y="344">THIS MAP — THE MINIMAP DOESN'T LABEL THEM, SO THEY ARE NOT PLACED HERE</text>
  <text class="ts" x="8" y="356">GEOMETRY FROM THE MINIMAP · LABELS BEST-EFFORT — CORRECT THEM</text>
</svg>
