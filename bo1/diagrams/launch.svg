<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300.5" viewBox="0 0 400 300.5" role="img" aria-label="Launch tactical schematic, traced from the in-game minimap.">
<defs><pattern id="hz" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="8" stroke="#c25b4e" stroke-width="2.5" opacity="0.38"/></pattern>
<style>
.terr{fill:#1b2429;stroke:#55636e;stroke-width:1.4}
.b{fill:#39454c;stroke:#8fb0aa;stroke-width:1.1}
.s{fill:#2b353c;stroke:#6b7d80;stroke-width:1}
.sp{fill:#17313a;stroke:#8fb0aa;stroke-width:1.3}
.rock{fill:#333f45;stroke:#7d8f92;stroke-width:0.9}
.water{fill:#24343c;stroke:#8fb0aa;stroke-width:1}
.hot{fill:url(#hz);stroke:#c25b4e;stroke-width:1}
.lbl{fill:#e6ecec;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
     font-size:9.0px;letter-spacing:0.7px}
.lbl2{fill:#93a4a6;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
      font-size:8.0px;letter-spacing:0.5px}
.hotlbl{fill:#d99a90;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
        font-size:8.0px;letter-spacing:0.5px}
.ttl{fill:#e6ecec;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
     font-size:10.5px;letter-spacing:1.0px;font-weight:600}
.key{fill:#93a4a6;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
     font-size:8.6px;letter-spacing:0.5px}
.keyhot{fill:#d99a90;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
        font-size:8.6px;letter-spacing:0.5px}
.pin{fill:#d98b4a}
.pinn{fill:#0b0f11;font-family:ui-sans-serif,system-ui,sans-serif;font-size:9px;font-weight:700}
.link{stroke:#55636e;stroke-width:1.3;fill:none;stroke-dasharray:3 3}

.go{fill:#1d3b2f;stroke:#5fb08a;stroke-width:1.5}
.golbl{fill:#a9dcc0;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
       font-size:9px;letter-spacing:0.7px}
</style></defs>
<text class="ttl" x="8" y="15">LAUNCH</text>
<text class="key" x="68.84" y="15">— team map</text>
<circle class="b" cx="200" cy="60" r="26"/>
<circle cx="200" cy="60" r="14" fill="#2b353c" stroke="#8fb0aa" stroke-width="0.9"/>
<text class="lbl" x="168" y="30">ROCKET</text>
<rect class="hot" x="176" y="96" width="48" height="116" rx="2"/>
<text class="hotlbl" x="181" y="157">MIDDLE</text>
<rect class="go" x="108" y="96" width="62" height="46" rx="2"/>
<text class="golbl" x="113" y="122">3-STOREY</text>
<rect class="go" x="230" y="96" width="62" height="46" rx="2"/>
<text class="golbl" x="235" y="122">3-STOREY</text>
<rect class="s" x="150" y="150" width="100" height="22" rx="2"/>
<text class="lbl2" x="155" y="164">MIRRORED BRIDGE</text>
<rect class="s" x="30" y="96" width="74" height="34" rx="2"/>
<text class="lbl2" x="35" y="116">W STRUCTS</text>
<rect class="s" x="296" y="96" width="74" height="34" rx="2"/>
<text class="lbl2" x="301" y="116">E STRUCTS</text>
<rect class="sp" x="30" y="138" width="74" height="24" rx="2"/>
<text class="lbl" x="35" y="153">SPETSNAZ</text>
<rect class="sp" x="296" y="138" width="74" height="24" rx="2"/>
<text class="lbl" x="301" y="153">BLACK OPS</text>
<rect class="s" x="112" y="182" width="176" height="24" rx="2"/>
<text class="lbl2" x="117" y="197">BULLETPROOF BARRIERS</text>
<circle class="pin" cx="158" cy="108" r="8"/><text class="pinn" x="155.5" y="111.2">1</text>
<circle class="pin" cx="242" cy="108" r="8"/><text class="pinn" x="239.5" y="111.2">1</text>
<rect class="go" x="8" y="222" width="16" height="11" rx="2"/>
<text class="key" x="30" y="231">head for</text>
<rect class="hot" x="92" y="222" width="16" height="11" rx="2"/>
<text class="keyhot" x="114" y="231">avoid / cross fast</text>
<text class="key" x="8" y="244.5">1  Three-storey routes — bottom to top rocket</text>
<text class="key" x="8" y="257">Identical both sides; one sprint to the top</text>
<text class="keyhot" x="8" y="269.5">Middle is split by rails — most deaths here</text>
<text class="keyhot" x="8" y="282">Rocket kills anyone beneath it at halfway</text>
</svg>