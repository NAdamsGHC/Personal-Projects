<svg xmlns="http://www.w3.org/2000/svg" width="420" height="260" viewBox="0 0 420 260" role="img" aria-label="Launch tactical schematic traced from the in-game minimap: a broad symmetric body with the rocket at top centre, a railroad-split middle lane, and mirrored three-storey routes either side.">
  <defs>
    <pattern id="ln-danger" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#c25b4e" stroke-width="2.5" opacity="0.4"/>
    </pattern>
    <style>
      .terr { fill:#1b2429; stroke:#55636e; stroke-width:1.4; }
      .b  { fill:#2b353c; stroke:#6b7d80; stroke-width:1.1; }
      .sp { fill:#17313a; stroke:#8fb0aa; stroke-width:1.3; }
      .t  { fill:#e6ecec; font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
            font-size:10px; letter-spacing:0.9px; }
      .ts { fill:#93a4a6; font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
            font-size:8.4px; letter-spacing:0.6px; }
      .td { fill:#d99a90; font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
            font-size:8.4px; letter-spacing:0.6px; }
      .rail { stroke:#6b7d80; stroke-width:1; stroke-dasharray:4 4; }
      .pin { fill:#d98b4a; }
      .pint { fill:#0b0f11; font-family:ui-sans-serif,system-ui,sans-serif; font-size:9px; font-weight:700; }
    </style>
  </defs>

  <text class="t"  x="8" y="14">LAUNCH</text>
  <text class="ts" x="66" y="14">— TRACED FROM THE IN-GAME MINIMAP</text>

  <!-- overall footprint: broad symmetric body -->
  <path class="terr" d="M150 30 L272 30 L300 78 L392 84 L410 108 L392 150 L330 158 L306 206 L116 206 L92 158 L30 150 L12 108 L30 84 L122 78 Z"/>

  <!-- rocket pad, top centre -->
  <circle class="b" cx="211" cy="56" r="24"/>
  <circle cx="211" cy="56" r="13" fill="#3c4952" stroke="#8fb0aa" stroke-width="1"/>
  <text class="t"  x="186" y="26">ROCKET</text>
  <text class="td" x="150" y="96">LAUNCHES MID-MATCH — KILLS ANYONE BENEATH</text>

  <!-- central lane, split by the tracks -->
  <rect x="192" y="86" width="38" height="118" fill="url(#ln-danger)" stroke="#c25b4e" stroke-width="1"/>
  <line class="rail" x1="211" y1="88" x2="211" y2="202"/>
  <text class="td" x="196" y="150" transform="rotate(-90 196 150)">MIDDLE — MOST DEATHS</text>

  <!-- mirrored three-storey routes either side of the rocket -->
  <rect class="b" x="146" y="96" width="40" height="52" rx="2"/>
  <text class="ts" x="150" y="116">3-STOREY</text>
  <text class="ts" x="150" y="128">BTM→TOP</text>
  <text class="ts" x="150" y="140">ROCKET</text>

  <rect class="b" x="236" y="96" width="40" height="52" rx="2"/>
  <text class="ts" x="240" y="116">3-STOREY</text>
  <text class="ts" x="240" y="128">MIRRORED</text>

  <!-- mirrored bridge across the centre -->
  <rect class="b" x="186" y="156" width="50" height="16" rx="2"/>
  <text class="ts" x="190" y="168">BRIDGE</text>

  <!-- west half -->
  <rect class="b" x="60" y="98" width="76" height="40" rx="2"/>
  <text class="ts" x="65" y="114">STRUCTURES</text>
  <text class="ts" x="65" y="126">+ COVER</text>
  <rect class="sp" x="20" y="104" width="34" height="42" rx="2"/>
  <text class="ts" x="24" y="122">SPZ</text>
  <text class="ts" x="24" y="134">SPAWN</text>
  <text class="td" x="60" y="152">BACK AREA — OPEN, MANY SPAWNS, AIRSTRIKE IT</text>

  <!-- east half -->
  <rect class="b" x="286" y="98" width="76" height="40" rx="2"/>
  <text class="ts" x="291" y="114">STRUCTURES</text>
  <text class="ts" x="291" y="126">MIRRORED</text>
  <rect class="sp" x="368" y="104" width="34" height="42" rx="2"/>
  <text class="ts" x="372" y="122">B.OPS</text>
  <text class="ts" x="372" y="134">SPAWN</text>
  <text class="td" x="252" y="186">B.OPS BACK ROOMS — CLAYMORES + INSERTIONS</text>

  <!-- bulletproof barriers note -->
  <rect class="b" x="192" y="186" width="38" height="12" rx="2"/>
  <text class="ts" x="120" y="196">BARRIERS —</text>
  <text class="ts" x="168" y="196">BULLETPROOF</text>

  <!-- markers -->
  <circle class="pin" cx="166" cy="104" r="8"/><text class="pint" x="163.5" y="107">1</text>
  <circle class="pin" cx="256" cy="104" r="8"/><text class="pint" x="253.5" y="107">1</text>

  <text class="ts" x="8" y="228">GEOMETRY FROM THE MINIMAP · LABELS BEST-EFFORT FROM THE WALKTHROUGH — CORRECT THEM</text>
  <circle class="pin" cx="14" cy="246" r="6"/><text class="pint" x="11.5" y="249">1</text>
  <text class="ts" x="25" y="249">THREE-STOREY ROUTES — IDENTICAL BOTH SIDES, ONE SPRINT TO TOP ROCKET</text>
</svg>
