<svg xmlns="http://www.w3.org/2000/svg" width="400" height="310" viewBox="0 0 400 310" role="img" aria-label="Jungle tactical schematic traced from the in-game minimap: organic terrain with raised clearings, a camp cluster to the south-west, structures north-east and east, and bridge crossings through the centre.">
  <defs>
    <pattern id="jg-danger" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#c25b4e" stroke-width="2.5" opacity="0.38"/>
    </pattern>
    <style>
      .terr { fill:#1b2429; stroke:#55636e; stroke-width:1.4; }
      .rock { fill:#39454c; stroke:#7d8f92; stroke-width:1; }
      .b  { fill:#2b353c; stroke:#6b7d80; stroke-width:1.1; }
      .t  { fill:#e6ecec; font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
            font-size:10px; letter-spacing:0.9px; }
      .ts { fill:#93a4a6; font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
            font-size:8.4px; letter-spacing:0.6px; }
      .td { fill:#d99a90; font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
            font-size:8.4px; letter-spacing:0.6px; }
      .bridge { stroke:#c9b98a; stroke-width:3; stroke-dasharray:5 3; fill:none; }
      .pin { fill:#d98b4a; }
      .pint { fill:#0b0f11; font-family:ui-sans-serif,system-ui,sans-serif; font-size:9px; font-weight:700; }
    </style>
  </defs>

  <text class="t"  x="8" y="14">JUNGLE</text>
  <text class="ts" x="64" y="14">— TRACED FROM THE IN-GAME MINIMAP</text>

  <!-- organic footprint -->
  <path class="terr" d="M150 24 L246 20 L300 34 L352 30 L370 58 L360 108 L376 140 L368 196 L330 226 L280 244 L246 272 L190 288 L130 282 L86 258 L44 240 L22 200 L34 160 L20 128 L48 100 L96 96 L118 56 Z"/>

  <!-- raised clearings / rock masses -->
  <path class="rock" d="M112 84 L166 78 L182 104 L172 132 L124 136 L104 112 Z"/>
  <text class="ts" x="118" y="112">NW RISE</text>

  <path class="rock" d="M176 58 L228 54 L236 84 L206 104 L176 96 Z"/>

  <path class="rock" d="M242 96 L312 92 L334 122 L322 158 L266 166 L238 136 Z"/>
  <text class="ts" x="256" y="128">NVA SIDE</text>
  <text class="ts" x="256" y="140">RISE</text>

  <path class="rock" d="M154 148 L228 142 L266 168 L250 214 L192 234 L152 206 Z"/>
  <text class="ts" x="172" y="184">CENTRE RISE</text>

  <!-- bridges through the middle -->
  <path class="bridge" d="M196 74 L200 152"/>
  <text class="td" x="204" y="112">SMALL</text>
  <text class="td" x="204" y="124">BRIDGE</text>

  <path class="bridge" d="M214 168 L246 214"/>
  <text class="td" x="222" y="200">MIDDLE BRIDGE</text>
  <text class="td" x="222" y="212">CUTS MAP IN HALF</text>

  <!-- north-east hut -->
  <path class="b" d="M284 34 L318 32 L322 62 L288 66 Z"/>
  <text class="ts" x="288" y="52">NE HUT</text>

  <!-- south-west camp cluster -->
  <rect class="b" x="68" y="168" width="30" height="24" rx="2"/>
  <rect class="b" x="72" y="198" width="26" height="20" rx="2"/>
  <rect class="b" x="100" y="188" width="22" height="22" rx="2"/>
  <text class="t"  x="52" y="234">SOG CAMP</text>
  <text class="td" x="40" y="248">POPULAR SPAWN — EASY TO GET PINNED</text>

  <!-- south structures -->
  <rect class="b" x="160" y="240" width="34" height="24" rx="2"/>
  <rect class="b" x="206" y="252" width="26" height="20" rx="2"/>

  <!-- east blocks -->
  <rect class="b" x="312" y="182" width="36" height="22" rx="2"/>
  <text class="ts" x="316" y="216">E BLOCKS</text>

  <!-- middle route danger -->
  <rect x="182" y="112" width="34" height="30" fill="url(#jg-danger)" stroke="#c25b4e" stroke-width="0.9" rx="2"/>

  <!-- markers -->
  <circle class="pin" cx="140" cy="96" r="8"/><text class="pint" x="137.5" y="99">1</text>
  <circle class="pin" cx="292" cy="112" r="8"/><text class="pint" x="289.5" y="115">2</text>

  <text class="ts" x="8" y="278">THE SNIPER PERCH, BACK TREE AND REBEL AREA ARE ON THIS MAP —</text>
  <text class="ts" x="8" y="290">THE MINIMAP DOESN'T LABEL THEM, SO THEY ARE NOT PLACED HERE</text>
  <text class="ts" x="8" y="304">GEOMETRY FROM THE MINIMAP · LABELS BEST-EFFORT — CORRECT THEM</text>
</svg>
