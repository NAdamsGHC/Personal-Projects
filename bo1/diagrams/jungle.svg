<svg xmlns="http://www.w3.org/2000/svg" width="400" height="299.5" viewBox="0 0 400 299.5" role="img" aria-label="Jungle tactical schematic, traced from the in-game minimap.">
<defs><pattern id="hz" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="8" stroke="#c25b4e" stroke-width="2.5" opacity="0.38"/></pattern>
<style>
.terr{fill:#1b2429;stroke:#55636e;stroke-width:1.4}
.b{fill:#39454c;stroke:#8fb0aa;stroke-width:1.1}
.s{fill:#2b353c;stroke:#6b7d80;stroke-width:1}
.sp{fill:#17313a;stroke:#8fb0aa;stroke-width:1.3}
.rock{fill:#333f45;stroke:#7d8f92;stroke-width:0.9}
.water{fill:#24343c;stroke:#8fb0aa;stroke-width:1}
.hot{fill:url(#hz);stroke:#c25b4e;stroke-width:1}
.lbl{fill:#e6ecec;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
     font-size:9.0px;letter-spacing:0.7px}
.lbl2{fill:#93a4a6;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
      font-size:8.0px;letter-spacing:0.5px}
.hotlbl{fill:#d99a90;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
        font-size:8.0px;letter-spacing:0.5px}
.ttl{fill:#e6ecec;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
     font-size:10.5px;letter-spacing:1.0px;font-weight:600}
.key{fill:#93a4a6;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
     font-size:8.6px;letter-spacing:0.5px}
.keyhot{fill:#d99a90;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
        font-size:8.6px;letter-spacing:0.5px}
.pin{fill:#d98b4a}
.pinn{fill:#0b0f11;font-family:ui-sans-serif,system-ui,sans-serif;font-size:9px;font-weight:700}
.link{stroke:#55636e;stroke-width:1.3;fill:none;stroke-dasharray:3 3}

.go{fill:#1d3b2f;stroke:#5fb08a;stroke-width:1.5}
.golbl{fill:#a9dcc0;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
       font-size:9px;letter-spacing:0.7px}
</style></defs>
<text class="ttl" x="8" y="15">JUNGLE</text>
<text class="key" x="68.84" y="15">— quick, long views</text>
<path class="terr" d="M150 26 L250 22 L306 36 L356 32 L372 60 L362 110 L376 142 L366 196 L328 226 L278 244 L244 272 L188 286 L128 280 L86 256 L44 238 L22 198 L34 158 L20 126 L48 98 L96 94 L118 56 Z"/>
<path class="go" d="M108 82 L164 76 L180 104 L170 134 L120 138 L100 112 Z"/>
<path class="go" d="M240 94 L312 90 L334 122 L322 158 L264 166 L236 134 Z"/>
<path class="hot" d="M150 148 L226 142 L264 168 L248 214 L190 234 L150 206 Z"/>
<rect class="s" x="60" y="166" width="62" height="26" rx="2"/>
<text class="lbl2" x="65" y="182">SOG CAMP</text>
<rect class="s" x="276" y="34" width="62" height="26" rx="2"/>
<text class="lbl2" x="281" y="50">NE HUT</text>
<rect class="s" x="300" y="182" width="62" height="24" rx="2"/>
<text class="lbl2" x="305" y="197">E BLOCKS</text>
<text class="hotlbl" x="186" y="108">SMALL</text>
<text class="hotlbl" x="186" y="119">BRIDGE</text>
<text class="hotlbl" x="196" y="200">MID BRIDGE</text>
<circle class="pin" cx="140" cy="96" r="8"/><text class="pinn" x="137.5" y="99.2">1</text>
<circle class="pin" cx="292" cy="112" r="8"/><text class="pinn" x="289.5" y="115.2">2</text>
<rect class="go" x="8" y="221" width="16" height="11" rx="2"/>
<text class="key" x="30" y="230">head for</text>
<rect class="hot" x="92" y="221" width="16" height="11" rx="2"/>
<text class="keyhot" x="114" y="230">avoid / cross fast</text>
<text class="key" x="8" y="243.5">1  NW rise    2  NVA-side rise</text>
<text class="keyhot" x="8" y="256">Mid bridge cuts the map — almost no cover</text>
<text class="key" x="8" y="268.5">Sniper perch, back tree and rebel not placed</text>
<text class="key" x="8" y="281">— the minimap carries no labels</text>
</svg>