<rect class="go" x="140" y="140" width="116" height="48" rx="2"/>
<text class="golbl" x="145" y="168">BLOWN-OUT BLDG</text>
<rect class="s" x="8" y="30" width="108" height="34" rx="2"/>
<text class="lbl2" x="13" y="51">NW BLOCK</text>
<rect class="go" x="8" y="140" width="108" height="44" rx="2"/>
<text class="golbl" x="13" y="159.25">W BUILDING</text>
<text class="golbl" x="13" y="172.75">3 STOREYS</text>
<rect class="s" x="8" y="196" width="108" height="30" rx="2"/>
<text class="lbl2" x="13" y="215">SW BLOCK</text>
<rect class="s" x="240" y="30" width="152" height="30" rx="2"/>
<text class="lbl2" x="245" y="49">NE BLOCKS</text>
<rect class="s" x="240" y="66" width="152" height="30" rx="2"/>
<text class="lbl2" x="245" y="85">NVA SPAWN SIDE</text>
<rect class="go" x="276" y="140" width="116" height="44" rx="2"/>
<text class="golbl" x="281" y="166">E BUILDING</text>
<rect class="s" x="276" y="196" width="116" height="30" rx="2"/>
