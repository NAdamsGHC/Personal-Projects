<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" role="img" aria-label="Cracked tactical schematic traced from the in-game minimap: dense urban blocks around a central blown-out building, with main roads crossing north-south and east-west.">
  <defs>
    <pattern id="ck-danger" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#c25b4e" stroke-width="2.5" opacity="0.34"/>
    </pattern>
    <style>
      .terr { fill:#1b2429; stroke:#55636e; stroke-width:1.4; }
      .b  { fill:#39454c; stroke:#8fb0aa; stroke-width:1.1; }
      .s  { fill:#2b353c; stroke:#6b7d80; stroke-width:1; }
      .t  { fill:#e6ecec; font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
            font-size:9.6px; letter-spacing:0.8px; }
      .ts { fill:#93a4a6; font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
            font-size:8px; letter-spacing:0.5px; }
      .td { fill:#d99a90; font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
            font-size:8px; letter-spacing:0.5px; }
      .pin { fill:#d98b4a; }
      .pint { fill:#0b0f11; font-family:ui-sans-serif,system-ui,sans-serif; font-size:8.5px; font-weight:700; }
    </style>
  </defs>

  <text class="t"  x="8" y="13">CRACKED</text>
  <text class="ts" x="70" y="13">— TRACED FROM THE IN-GAME MINIMAP · MULTI-ENTRANCE EVERYWHERE</text>

  <!-- footprint -->
  <path class="terr" d="M14 24 L170 20 L200 30 L392 26 L396 190 L360 196 L354 240 L300 244 L296 276 L156 280 L150 262 L60 266 L14 258 L8 190 L26 150 L8 96 Z"/>

  <!-- main roads -->
  <rect x="204" y="24" width="30" height="252" fill="url(#ck-danger)" stroke="#c25b4e" stroke-width="0.9"/>
  <rect x="12" y="112" width="380" height="22" fill="url(#ck-danger)" stroke="#c25b4e" stroke-width="0.9"/>
  <text class="td" x="208" y="72" transform="rotate(-90 208 72)">MAIN ROAD</text>
  <text class="td" x="40" y="127">MAIN ROAD — DANGEROUS TO CROSS</text>

  <!-- centre blown-out building -->
  <rect class="b" x="152" y="150" width="52" height="62" rx="2"/>
  <rect class="s" x="164" y="164" width="28" height="32" rx="2"/>
  <text class="t"  x="120" y="146">BLOWN-OUT BUILDING</text>
  <text class="ts" x="152" y="224">CLIMB IT — CLAYMORES</text>
  <text class="ts" x="152" y="234">ON 2ND STOREY</text>

  <!-- north-west blocks -->
  <rect class="s" x="30" y="54" width="48" height="52" rx="2"/>
  <text class="ts" x="34" y="80">NW BLOCK</text>

  <!-- west buildings -->
  <rect class="b" x="64" y="132" width="70" height="58" rx="2"/>
  <text class="ts" x="68" y="156">W BUILDING</text>
  <text class="ts" x="68" y="168">3 STOREYS</text>
  <rect class="s" x="96" y="174" width="36" height="44" rx="2"/>

  <!-- south-west -->
  <rect class="s" x="12" y="182" width="48" height="80" rx="2"/>
  <text class="ts" x="16" y="220">SW BLOCK</text>

  <!-- north-east dense cluster -->
  <rect class="s" x="240" y="30" width="46" height="34" rx="2"/>
  <rect class="s" x="294" y="30" width="42" height="30" rx="2"/>
  <rect class="s" x="344" y="34" width="34" height="44" rx="2"/>
  <rect class="s" x="240" y="72" width="40" height="34" rx="2"/>
  <rect class="s" x="288" y="70" width="46" height="36" rx="2"/>
  <text class="ts" x="242" y="52">NE — SPAWN SIDE BLOCKS</text>

  <!-- east buildings -->
  <rect class="b" x="242" y="154" width="58" height="52" rx="2"/>
  <text class="ts" x="246" y="180">E BUILDING</text>
  <rect class="s" x="306" y="156" width="44" height="52" rx="2"/>
  <rect class="s" x="360" y="156" width="32" height="30" rx="2"/>

  <!-- south blocks -->
  <rect class="s" x="160" y="250" width="42" height="30" rx="2"/>
  <rect class="s" x="240" y="224" width="58" height="48" rx="2"/>
  <text class="ts" x="244" y="252">S BLOCK</text>

  <!-- markers -->
  <circle class="pin" cx="196" cy="158" r="7.5"/><text class="pint" x="193.5" y="161">1</text>
  <circle class="pin" cx="126" cy="140" r="7.5"/><text class="pint" x="123.5" y="143">2</text>

  <text class="ts" x="8" y="288">SOG LOOKOUT, NVA LOOKOUT, FRUIT MARKET, THE AWNING AND THE RABBIT HOLE ARE ON</text>
  <text class="ts" x="8" y="297">THIS MAP — UNLABELLED ON THE MINIMAP · LABELS BEST-EFFORT, CORRECT THEM</text>
</svg>
