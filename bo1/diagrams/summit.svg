<line class="link" x1="116" y1="126" x2="130" y2="140"/>
<line class="link" x1="270" y1="124" x2="288" y2="124"/>
<line class="link" x1="338" y1="140" x2="338" y2="148"/>
<circle class="pin" cx="256" cy="120" r="9"/><text class="pinn" x="252.9" y="124">1</text>
<circle class="pin" cx="184" cy="68" r="9"/><text class="pinn" x="180.9" y="72">2</text>
</svg>