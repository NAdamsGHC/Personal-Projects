<svg xmlns="http://www.w3.org/2000/svg" width="400" height="280" viewBox="0 0 400 280" role="img" aria-label="Summit tactical schematic, traced from the in-game minimap.">
<defs><pattern id="hz" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="8" stroke="#c25b4e" stroke-width="2.5" opacity="0.38"/></pattern>
<style>
.terr{fill:#1b2429;stroke:#55636e;stroke-width:1.4}
.b{fill:#39454c;stroke:#8fb0aa;stroke-width:1.1}
.s{fill:#2b353c;stroke:#6b7d80;stroke-width:1}
.sp{fill:#17313a;stroke:#8fb0aa;stroke-width:1.3}
.rock{fill:#333f45;stroke:#7d8f92;stroke-width:0.9}
.water{fill:#24343c;stroke:#8fb0aa;stroke-width:1}
.hot{fill:url(#hz);stroke:#c25b4e;stroke-width:1}
.lbl{fill:#e6ecec;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
     font-size:11.5px;letter-spacing:0.4px}
.lbl2{fill:#93a4a6;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
      font-size:10.5px;letter-spacing:0.2px}
.hotlbl{fill:#d99a90;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
        font-size:10.5px;letter-spacing:0.2px}
.ttl{fill:#e6ecec;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
     font-size:13.0px;letter-spacing:0.8px;font-weight:600}
.pin{fill:#d98b4a}
.pinn{fill:#0b0f11;font-family:ui-sans-serif,system-ui,sans-serif;font-size:11px;font-weight:700}
.link{stroke:#55636e;stroke-width:1.3;fill:none;stroke-dasharray:3 3}

.go{fill:#1d3b2f;stroke:#5fb08a;stroke-width:1.5}
.golbl{fill:#a9dcc0;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
       font-size:11.5px;letter-spacing:0.4px}
</style></defs>
<text class="ttl" x="8" y="17">SUMMIT</text>
<rect class="go" x="130" y="108" width="140" height="96" rx="2"/>
<text class="golbl" x="135" y="153.25">CONTROL ROOM</text>
<text class="golbl" x="135" y="166.75">TOP + BOTTOM</text>
<rect class="hot" x="130" y="212" width="140" height="20" rx="2"/>
<text class="hotlbl" x="135" y="226">MIDDLE HALL</text>
<rect class="hot" x="288" y="108" width="100" height="32" rx="2"/>
<text class="hotlbl" x="293" y="128">BACK ROOMS</text>
<rect class="b" x="288" y="148" width="100" height="32" rx="2"/>
<text class="lbl" x="293" y="168">PORCH</text>
<rect class="s" x="288" y="188" width="100" height="30" rx="2"/>
<text class="lbl2" x="293" y="207">ELECTRICAL</text>
<rect class="go" x="130" y="58" width="66" height="40" rx="2"/>
<text class="golbl" x="135" y="75.25">BACK</text>
<text class="golbl" x="135" y="88.75">AREA</text>
<rect class="go" x="204" y="58" width="66" height="40" rx="2"/>
