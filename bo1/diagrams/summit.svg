<line class="link" x1="116" y1="126" x2="130" y2="140"/>
<line class="link" x1="270" y1="124" x2="288" y2="124"/>
<line class="link" x1="338" y1="140" x2="338" y2="148"/>
<circle class="pin" cx="256" cy="120" r="8"/><text class="pinn" x="253.5" y="123.2">1</text>
<circle class="pin" cx="184" cy="68" r="8"/><text class="pinn" x="181.5" y="71.2">2</text>
<rect class="go" x="8" y="276" width="16" height="11" rx="2"/>
<text class="key" x="30" y="285">head for</text>
<rect class="hot" x="92" y="276" width="16" height="11" rx="2"/>
<text class="keyhot" x="114" y="285">avoid / cross fast</text>
<text class="key" x="8" y="298.5">1  Top control room — bigger once glass breaks</text>
<text class="key" x="8" y="311">2  Back area / back stairs — underused</text>
<text class="key" x="8" y="323.5">Rock area is the sniper route, west side</text>
<text class="key" x="8" y="336">Black Ops balcony views major spawn points</text>
<text class="keyhot" x="8" y="348.5">Back rooms is fast to the porch, and fatal</text>
<text class="key" x="8" y="361">Orientation approximate — only west is stated</text>
</svg>