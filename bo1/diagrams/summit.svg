<text class="golbl" x="209" y="88.75">STAIRS</text>
<rect class="b" x="16" y="108" width="100" height="36" rx="2"/>
<text class="lbl" x="21" y="130">ROCK AREA</text>
<rect class="s" x="16" y="152" width="100" height="26" rx="2"/>
