<svg xmlns="http://www.w3.org/2000/svg" width="400" height="220" viewBox="0 0 400 220" role="img" aria-label="Crisis tactical schematic, traced from the in-game minimap.">
<defs><pattern id="hz" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="8" stroke="#c25b4e" stroke-width="2.5" opacity="0.38"/></pattern>
<style>
.terr{fill:#1b2429;stroke:#55636e;stroke-width:1.4}
.b{fill:#39454c;stroke:#8fb0aa;stroke-width:1.1}
.s{fill:#2b353c;stroke:#6b7d80;stroke-width:1}
.sp{fill:#17313a;stroke:#8fb0aa;stroke-width:1.3}
.rock{fill:#333f45;stroke:#7d8f92;stroke-width:0.9}
.water{fill:#24343c;stroke:#8fb0aa;stroke-width:1}
.hot{fill:url(#hz);stroke:#c25b4e;stroke-width:1}
.lbl{fill:#e6ecec;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
     font-size:11.5px;letter-spacing:0.4px}
.lbl2{fill:#93a4a6;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
      font-size:10.5px;letter-spacing:0.2px}
.hotlbl{fill:#d99a90;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
        font-size:10.5px;letter-spacing:0.2px}
.ttl{fill:#e6ecec;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
     font-size:13.0px;letter-spacing:0.8px;font-weight:600}
.pin{fill:#d98b4a}
.pinn{fill:#0b0f11;font-family:ui-sans-serif,system-ui,sans-serif;font-size:11px;font-weight:700}
.link{stroke:#55636e;stroke-width:1.3;fill:none;stroke-dasharray:3 3}

.go{fill:#1d3b2f;stroke:#5fb08a;stroke-width:1.5}
.golbl{fill:#a9dcc0;font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
       font-size:11.5px;letter-spacing:0.4px}
</style></defs>
<text class="ttl" x="8" y="17">CRISIS</text>
<rect class="go" x="20" y="60" width="116" height="62" rx="2"/>
<text class="golbl" x="25" y="88.25">CASTRO'S</text>
<text class="golbl" x="25" y="101.75">HOUSE</text>
<rect class="sp" x="20" y="130" width="116" height="30" rx="2"/>
<text class="lbl" x="25" y="149">TROPAS</text>
<rect class="s" x="20" y="172" width="116" height="28" rx="2"/>
<text class="lbl2" x="25" y="190">SW BUILDING</text>
<rect class="s" x="150" y="40" width="108" height="34" rx="2"/>
<text class="lbl2" x="155" y="61">MID ARCHES</text>
<rect class="s" x="150" y="84" width="108" height="34" rx="2"/>
<text class="lbl2" x="155" y="105">SIDE ROOF</text>
<rect class="hot" x="150" y="130" width="108" height="30" rx="2"/>
<text class="hotlbl" x="155" y="149">CONTROL RM</text>
<rect class="s" x="150" y="172" width="108" height="28" rx="2"/>
<text class="lbl2" x="155" y="190">BOTTOM CASTRO</text>
<rect class="rock" x="272" y="60" width="116" height="30" rx="2"/>
<text class="lbl" x="277" y="79">ROCK PERCH 1</text>
<rect class="rock" x="272" y="100" width="116" height="30" rx="2"/>
<text class="lbl" x="277" y="119">ROCK PERCH 2</text>
<rect class="go" x="272" y="140" width="116" height="30" rx="2"/>
<text class="golbl" x="277" y="159">MID SANDBAGS</text>
<rect class="sp" x="272" y="180" width="116" height="26" rx="2"/>
<text class="lbl" x="277" y="197">OP 40 · BEACH</text>
<circle class="pin" cx="128" cy="72" r="9"/><text class="pinn" x="124.9" y="76">1</text>
<circle class="pin" cx="250" cy="142" r="9"/><text class="pinn" x="246.9" y="146">2</text>
</svg>