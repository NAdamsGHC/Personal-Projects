<circle class="pin" cx="250" cy="142" r="8"/><text class="pinn" x="247.5" y="145.2">2</text>
<rect class="go" x="8" y="216" width="16" height="11" rx="2"/>
<text class="key" x="30" y="225">head for</text>
<rect class="hot" x="92" y="216" width="16" height="11" rx="2"/>
<text class="keyhot" x="114" y="225">avoid / cross fast</text>
<text class="key" x="8" y="238.5">1  Wall jump to upper Castro, skip the stairs</text>
<text class="key" x="8" y="251">2  Control room — quickest route between spawns</text>
<text class="keyhot" x="8" y="263.5">Centre stairs stay the popular choke</text>
<text class="key" x="8" y="276">Rock hill leads up to the middle sandbags</text>
</svg>